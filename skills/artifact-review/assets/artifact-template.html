<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__AREV_TITLE__</title>
<style>
:root {
  --bg: #F7F8FA;
  --surface: #FFFFFF;
  --fg: #202228;
  --muted: #595D69;
  --border: #C3C6CC;
  --border-soft: #E1E3E7;
  --accent: #2947A5;
  --accent-soft: #EDF1FB;
  --row-hover: #F2F3F5;
  --ok: #2F6B44;
  --ok-bg: #EAF4EE;
  --warn: #8A5A12;
  --warn-bg: #FBF3E4;
  --bad: #A33327;
  --bad-bg: #FBECEA;
  --code-bg: #F2F3F5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17191F;
    --surface: #202228;
    --fg: #E7E9ED;
    --muted: #A0A4AD;
    --border: #3A3D46;
    --border-soft: #2C2F37;
    --accent: #8CA3E4;
    --accent-soft: #1C2E6A;
    --row-hover: #262930;
    --ok: #94D3AC;
    --ok-bg: #1B3226;
    --warn: #E6C07A;
    --warn-bg: #362A16;
    --bad: #F0A79C;
    --bad-bg: #3A1F1B;
    --code-bg: #2A2D35;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow-x: hidden;
}
main { max-width: 880px; margin: 0 auto; padding: 40px 20px 80px; }
h1 { font-size: 30px; line-height: 1.25; margin: 0 0 8px; letter-spacing: -0.01em; }
h2 { font-size: 22px; margin: 48px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-soft); }
h3 { font-size: 17px; margin: 28px 0 8px; }
p { margin: 0 0 14px; }
ul, ol { margin: 0 0 14px; padding-left: 22px; }
li { margin-bottom: 6px; }
a { color: var(--accent); }
.lede { color: var(--muted); font-size: 17px; margin-bottom: 24px; }
code, kbd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }

/* Anything that can be wide lives in one of these, so the page never scrolls sideways. */
.scroll { overflow-x: auto; margin: 0 0 20px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface); }
pre { overflow-x: auto; background: var(--code-bg); padding: 14px 16px; border-radius: 10px; margin: 0 0 20px; }
pre code { background: none; padding: 0; }
img, svg { max-width: 100%; height: auto; }

table { border-collapse: collapse; width: 100%; min-width: 560px; }
caption { text-align: left; padding: 12px 14px 0; color: var(--muted); font-size: 14px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border-soft); vertical-align: top; font-size: 14.5px; }
th { font-weight: 600; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--row-hover); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.b-ok { background: var(--ok-bg); color: var(--ok); }
.b-warn { background: var(--warn-bg); color: var(--warn); }
.b-bad { background: var(--bad-bg); color: var(--bad); }
.note { background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 12px 16px; margin: 0 0 20px; font-size: 15px; }
.card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 10px; padding: 16px 18px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
@media (max-width: 600px) { .cards { grid-template-columns: 1fr; } }

/* Human decisions belong in these, never in prose asking the reader to reply. */
fieldset { border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface); padding: 14px 18px 16px; margin: 0 0 20px; }
legend { font-weight: 600; padding: 0 8px; font-size: 15px; }
.choice { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.choice input { margin-top: 5px; flex: none; width: 16px; height: 16px; accent-color: var(--accent); }
.choice label { cursor: pointer; }
.why { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
input[type="text"], input[type="number"], textarea, select {
  font: inherit; color: inherit; background: var(--bg);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; max-width: 100%;
}
button { font: inherit; color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--border-soft); color: var(--muted); font-size: 13.5px; }
</style>
</head>
<body>
<main>
<!-- arev:content -->
<h1>__AREV_TITLE__</h1>
<p class="lede">Replace this region with the artifact. Keep the shell above and below it.</p>
<!-- /arev:content -->
</main>
</body>
</html>
